[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"
  # Public API hostname (no trailing /api). Do not use SERVER_IP:8082 — that port is localhost-only on the host.
  BACKEND_API_URL = "https://api.mukasamatthew.com"
  # Browser calls the API directly (CORS + refresh cookies on api.mukasamatthew.com). Works even if /api proxy is misconfigured.
  VITE_API_URL = "https://api.mukasamatthew.com/api"

# The /api proxy is generated into dist/_redirects during the build from
# BACKEND_API_URL. Keeping API traffic same-origin preserves refresh cookies
# without committing an environment-specific backend domain.

# Static assets from Vite are content-hashed (e.g. /assets/index-abc123.js)
# so they can be cached for one year. Safe because the hash changes on every build.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts and images in /public are not hashed — cache them for a short time only.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# All HTML pages and SSR responses must be revalidated on every load.
# This ensures users always get the latest deploy rather than a stale cached page.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
