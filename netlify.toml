[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"

# Same-origin /api → public API (survives stale Netlify UI values like host:8082).
[[redirects]]
  from = "/api/*"
  to = "https://api.mukasamatthew.com/api/:splat"
  status = 200
  force = true

[context.production.environment]
  BACKEND_API_URL = "https://api.mukasamatthew.com"
  BACKEND_API_URL_CANONICAL = "https://api.mukasamatthew.com"

# Browser uses same-origin /api only (see src/services/api/client.ts). Do not set VITE_API_URL in production.

# Static assets from Vite are content-hashed (e.g. /assets/index-abc123.js)
# so they can be cached for one year. Safe because the hash changes on every build.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts and images in /public are not hashed — cache them for a short time only.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# All HTML pages and SSR responses must be revalidated on every load.
# This ensures users always get the latest deploy rather than a stale cached page.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
